<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poké Ball Grid - design mockup</title>
<style>
  :root { --bg:#f5f4ef; --card:#ffffff; --text:#2c2c2a; --muted:#6b6a64; --line:#d3d1c7; --red:#e24b4a; --blue:#185fa5; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 24px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  h1 { font-size:22px; font-weight:500; text-align:center; margin:0 0 4px; }
  .sub { text-align:center; color:var(--muted); font-size:14px; margin:0 0 28px; }
  .row { display:flex; flex-wrap:wrap; gap:24px; justify-content:center; }
  figure { margin:0; }
  figcaption { text-align:center; color:var(--muted); font-size:14px; margin-top:10px; }
  .screen { width:300px; min-height:420px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .title { font-size:18px; font-weight:500; margin:12px 0 4px; }
  .small { font-size:13px; color:var(--muted); margin:0; }
  input { width:100%; padding:10px; font-size:15px; text-align:center; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); }
  button { width:100%; padding:10px; font-size:15px; font-weight:500; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); }
  button.primary { background:var(--text); color:#fff; border-color:var(--text); }
  .link { color:var(--blue); font-size:14px; margin-top:16px; }
  .top { display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:12px; font-weight:500; }
  .hearts { font-size:20px; letter-spacing:2px; }
  .hearts .lost { color:var(--line); }
  .hearts .full { color:var(--red); }
  .timer { font-size:14px; color:var(--muted); }
  .board { display:grid; grid-template-columns:repeat(6,1fr); gap:3px; background:#8a8880; padding:3px; border-radius:10px; width:100%; }
  .cell { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:500; color:var(--muted); }
  .cell.bad { outline:3px solid var(--red); outline-offset:-3px; }
  .zA{background:#cecbf6}.zB{background:#9fe1cb}.zC{background:#fac775}.zD{background:#f5c4b3}.zE{background:#b5d4f4}.zF{background:#c0dd97}
  .lb { width:100%; text-align:left; margin-top:8px; }
  .lb div { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .lb div:first-child { border-top:none; }
  .lb .me { background:#e6f1fb; color:#0c447c; border-radius:6px; padding:8px 8px; margin:0 -8px; border-top:none; }
  .big { font-size:34px; font-weight:500; margin:6px 0 0; }
  .spacer { flex:1; }
</style>
</head>
<body>
<h1>Poké Ball Grid</h1>
<p class="sub">Design mockup. This is a picture of the plan, not the working game.</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pb" viewBox="0 0 32 32">
    <path d="M2 16A14 14 0 0 1 30 16Z" fill="#e24b4a"/>
    <path d="M2 16A14 14 0 0 0 30 16Z" fill="#fff"/>
    <circle cx="16" cy="16" r="14" fill="none" stroke="#2c2c2a" stroke-width="2"/>
    <line x1="2" y1="16" x2="30" y2="16" stroke="#2c2c2a" stroke-width="2"/>
    <circle cx="16" cy="16" r="4.5" fill="#fff" stroke="#2c2c2a" stroke-width="2"/>
  </symbol>
</svg>

<div class="row">
  <figure>
    <div class="screen">
      <svg width="64" height="64" style="margin-top:28px"><use href="#pb"/></svg>
      <div class="title">Poké Ball Grid</div>
      <p class="small" style="margin-bottom:20px">One ball per row, column, and zone.</p>
      <input type="text" placeholder="Your name (optional)" aria-label="Your name">
      <button class="primary" style="margin-top:10px">Start game</button>
      <div class="link">High scores</div>
    </div>
    <figcaption>1. Start screen</figcaption>
  </figure>

  <figure>
    <div class="screen">
      <div class="top"><span>Poké Ball Grid</span><span class="hearts"><span class="full">♥</span><span class="full">♥</span><span class="lost">♥</span></span></div>
      <div class="board" id="b1"></div>
      <p class="small" style="margin-top:12px">Tap a square: ✕, then ball, then empty</p>
      <div class="spacer"></div>
      <p class="timer">Time 0:48</p>
    </div>
    <figcaption>2. Playing, with one mistake</figcaption>
  </figure>

  <figure>
    <div class="screen">
      <div class="top"><span>Poké Ball Grid</span><span class="hearts"><span class="full">♥</span><span class="full">♥</span><span class="lost">♥</span></span></div>
      <div class="board" id="b2"></div>
      <div class="title" style="margin-top:14px">You win, Sam</div>
      <div class="big">1:42</div>
      <p class="small" style="margin-bottom:10px">Your time</p>
      <button>View high scores</button>
    </div>
    <figcaption>3. Win screen</figcaption>
  </figure>

  <figure>
    <div class="screen">
      <div class="title" style="margin-top:6px">High scores</div>
      <p class="small">Fastest times</p>
      <div class="lb">
        <div><span>1. Maya</span><span>1:05</span></div>
        <div><span>2. Guest</span><span>1:31</span></div>
        <div class="me"><span>3. Sam</span><span>1:42</span></div>
        <div><span>4. Leo</span><span>2:10</span></div>
        <div><span>5. Guest</span><span>3:02</span></div>
      </div>
      <div class="spacer"></div>
      <button class="primary">Play again</button>
    </div>
    <figcaption>4. High score list</figcaption>
  </figure>
</div>

<script>
var Z = ["AAABBB","AACBBB","ACCCDD","EECCDD","EEFFDD","EFFFFD"];
var ball = '<svg width="28" height="28"><use href="#pb"/></svg>';
function build(id, balls, xs, bad) {
  var h = "";
  for (var r = 0; r < 6; r++) for (var c = 0; c < 6; c++) {
    var k = r + "," + c, inner = "", cls = "cell z" + Z[r][c];
    if (balls.indexOf(k) > -1) inner = ball; else if (xs.indexOf(k) > -1) inner = "✕";
    if (bad === k) { inner = ball; cls += " bad"; }
    h += '<div class="' + cls + '">' + inner + "</div>";
  }
  document.getElementById(id).innerHTML = h;
}
build("b1", ["0,1","1,3","3,2"], ["1,2","0,0"], "2,4");
build("b2", ["0,1","1,3","2,5","3,2","4,0","5,4"], [], "");
</script>
</body>
</html>
